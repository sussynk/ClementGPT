<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sets title and favicon -->
    <title>ClementGPT</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg" />

    <!-- Links to external stylesheets -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="app">
      <aside class="sidebar">
        <button class="new-chat">&#x21bb; <span>Restart Chat</span></button>
        <nav class="sidebar-nav">
          <a href="index.html" class="active">Home</a>
          <a href="contact.html">Contact Us</a>
        </nav>
        <footer class="sidebar-footer">
          <div class="profile"></div>
          <button class="logout-btn" title="Log Out">&#x23fb;</button>
        </footer>
      </aside>

      <!-- Navigation bar -->
      <main class="main">
        <header class="header">
          <button class="menu-toggle">&#x2630;</button>
          <h1>ClementGPT</h1>
          <nav class="header-nav">
            <a href="index.html" class="active">Home</a>
            <a href="contact.html">Contact Us</a>
          </nav>
        </header>

        <!-- Main content -->
        <div id="chat-area" class="chat-area">
          <div class="message bot-message">
            <p>Hello! I'm ClementGPT. How can I help you today?</p>
          </div>
        </div>

        <div class="chat-input-container">
          <form id="chat-form" class="chat-input">
            <textarea
              id="message-input"
              placeholder="Message ClementGPT..."
            ></textarea>
            <button type="submit" title="Send Message">&#x27a4;</button>
          </form>
        </div>
      </main>
    </div>
    <div class="mobile-menu-overlay"></div>

    <!-- Links to external scripts -->
    <script src="script.js"></script>
  </body>
</html>
