<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About Us - ClementGPT</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="sidebar">
        <div class="sidebar-header">
          <button class="new-chat-button" id="new-chat-btn">
            &#x21bb; Restart Chat
          </button>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About The Team</a>
          <a href="contact.html">Contact Us</a>
        </nav>
        <div class="sidebar-footer">
          <div class="profile-section">
            <span class="profile-name"></span>
          </div>
          <a href="#" class="logout-button" title="Log Out">
            <img
              src="assets/logout.svg"
              alt="Log Out"
              width="24"
              height="24"
              style="display:inline-block;vertical-align:middle;filter:invert(38%) sepia(99%) saturate(749%) hue-rotate(88deg) brightness(102%) contrast(101%);"
            />
          </a>
        </div>
      </div>
      <div class="main-content">
        <div id="about-view" class="view active-view">
          <header class="chat-header">
            <button class="menu-toggle-btn">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path>
              </svg>
            </button>
            <h1>About The Team</h1>
            <nav class="header-nav">
              <a href="index.html">Home</a>
              <a href="about.html">About The Team</a>
              <a href="contact.html">Contact Us</a>
            </nav>
          </header>
          <div class="page-content">
            <p class="page-subtitle">
              Meet the amazing team behind ClementGPT.
            </p>
            <div class="team-grid">
              <!-- Team Member 1 -->
              <div class="team-member">
                <img src="assets/photo/clement.webp" alt="Clement Chong" class="team-member-photo" width="100" height="100" border-radius="50%" />
                <h3>Clement Chong</h3>
                <p>Group Leader</p>
              </div>
              <!-- Team Member 2 -->
              <div class="team-member">
                <h3>Chen Zhi Yong</h3>
                <p>Group Co-Leader</p>
              </div>
              <!-- Team Member 3 -->
              <div class="team-member">
                <h3>Hon Yen Yang</h3>
                <p>Group Member</p>
              </div>
              <!-- Team Member 4 -->
              <div class="team-member">
                <h3>Praveen</h3>
                <p>Group Member</p>
              </div>
              <!-- Team Member 5 -->
              <div class="team-member">
                <h3>Ng Chin Yang</h3>
                <p>Group Member</p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="mobile-menu-backdrop"></div>
    <script src="script.js"></script>
  </body>
</html>
