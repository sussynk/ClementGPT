name: Security Audit

on:
  push:
    branches: [main, script_change_v1]
  pull_request:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt bandit pip-audit

      - name: Run Bandit (Python SAST)
        run: bandit -r app.py config.py -ll -q

      - name: Run pip-audit (CVE dependency check)
        run: pip-audit -r requirements.txt
