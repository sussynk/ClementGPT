# Phase 1 — pre-commit hooks to catch secrets before they hit git
# Setup: pip install pre-commit detect-secrets
#        pre-commit install
#
# What this does:
#   detect-secrets  — scans every staged file for API keys, tokens, passwords
#   end-of-file-fixer — enforces clean file endings (hygiene)
#   trailing-whitespace — strips trailing spaces

repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.env\.example$'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ['--maxkb=500']
