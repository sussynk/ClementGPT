<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - ClementGPT</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <button class="new-chat" onclick="window.location.href='index.html'">&#x21bb; Restart Chat</button>
        <nav class="sidebar-nav">
          <a href="index.html">Home</a>
          <a href="about.html">About The Team</a>
          <a href="contact.html" class="active">Contact Us</a>
        </nav>
        <footer class="sidebar-footer">
          <div class="profile">
            <!-- Dynamically updated by script.js -->
          </div>
           <button class="logout-btn" title="Log Out">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
          </button>
        </footer>
      </aside>

      <main class="main">
        <header class="header">
          <button class="menu-toggle">
            <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path></svg>
          </button>
          <h1>Contact Us</h1>
          <nav class="header-nav">
            <a href="index.html">Home</a>
            <a href="about.html">About The Team</a>
            <a href="contact.html" class="active">Contact Us</a>
          </nav>
        </header>

        <div class="page-content">
          <p class="page-subtitle">
            We'd love to hear from you! Send us a message.
          </p>
          <form id="contact-form" class="form-container" novalidate>
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" />
              <div class="error"></div>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" />
              <div class="error"></div>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5"></textarea>
              <div class="error"></div>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </main>
    </div>
    <div class="mobile-menu-overlay"></div>
    <script src="script.js"></script>
  </body>
</html>
