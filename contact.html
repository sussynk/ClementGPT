<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Sets title and favicon -->
    <title>Contact Us - ClementGPT</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.svg" />

    <!-- Links to external stylesheets -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="app">
      <aside class="sidebar">
        <button class="new-chat" onclick="window.location.href='index.html'">
          &#x21bb; <span>Restart Chat</span>
        </button>
        <nav class="sidebar-nav">
          <a href="index.html">Home</a>
          <a href="contact.html" class="active">Contact Us</a>
        </nav>
        <footer class="sidebar-footer">
          <div class="profile"></div>

          <button class="logout-btn" title="Log Out">&#x23fb;</button>
        </footer>
      </aside>

      <!-- Navigation bar -->
      <main class="main">
        <header class="header">
          <button class="menu-toggle">&#x2630;</button>
          <h1>Contact Us</h1>
          <nav class="header-nav">
            <a href="index.html">Home</a>
            <a href="contact.html" class="active">Contact Us</a>
          </nav>
        </header>

        <!-- Main content -->
        <div class="page-content">
          <p class="page-subtitle">
            We'd love to hear from you! Send us a message.
          </p>
          <!-- Contact Form -->
          <form id="contact-form" class="form-container" novalidate>
            <div class="form-group">
              <label for="name">Name</label>
              <input type="text" id="name" />
              <div class="error"></div>
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" />
              <div class="error"></div>
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" rows="5"></textarea>
              <div class="error"></div>
            </div>
            <button type="submit" class="submit-btn">Send Message</button>
          </form>
        </div>
      </main>
    </div>
    <div class="mobile-menu-overlay"></div>

    <!-- Links to external scripts -->
    <script src="script.js"></script>
  </body>
</html>
